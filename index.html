  <!-- Canonical -->
  <link
    rel="canonical"
    id="dynamic-canonical"
    href="https://homoget.ae/"
  />
  <script>
    // Dynamic clean canonical updater for React Single Page Application
    (function() {
      let cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
      if (cleanUrl.endsWith('/') && cleanUrl !== window.location.protocol + '//' + window.location.host + '/') {
        cleanUrl = cleanUrl.slice(0, -1);
      }
      window.addEventListener('DOMContentLoaded', () => {
        const canonicalElement = document.getElementById('dynamic-canonical');
        if (canonicalElement) {
          canonicalElement.setAttribute('href', cleanUrl);
        }
      });
    })();
  </script>
